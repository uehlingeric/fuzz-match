[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fuzz-match"
version = "1.0.0"
description = "High-performance fuzzy string matching with TF-IDF and Levenshtein algorithms"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Eric Uehling" }]
keywords = ["fuzzy-matching", "string-similarity", "record-linkage"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
]
dependencies = [
  "pandas>=1.0",
  "rapidfuzz>=2.0",
  "sparse-dot-topn>=0.2.6",
  "scikit-learn>=0.20",
  "numpy>=1.0",
]

[dependency-groups]
dev = [
  "pytest>=7.0",
  "pytest-cov>=4.0",
  "ruff>=0.1",
]

[project.scripts]
fuzz-match = "fuzz_match.cli:main"

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=src --cov-report=term-missing"
